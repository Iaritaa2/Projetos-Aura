<div id="modal-container" class="fixed inset-0 bg-gray-900/40 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    
    <div class="bg-white w-full max-w-[500px] rounded-[32px] p-8 shadow-2xl relative">
        
        <button onclick="toggleModal()" class="absolute top-6 right-6 text-gray-400 hover:text-gray-600">
            <i data-lucide="x" class="h-5 w-5"></i>
        </button>

        <div class="flex items-center gap-4 mb-4">
            <div id="modal-icon-box" class="p-2 rounded-xl bg-[#f5f0ff]">
                <i id="modal-icon" data-lucide="wallet" class="h-6 w-6 text-purple-600"></i>
            </div>
            <h3 id="modal-title" class="text-2xl font-bold text-[#581c87]">Atualizar Saldo do Dia</h3>
        </div>

        <p id="modal-description" class="text-purple-500 text-sm mb-6">
            Digite o valor atual disponível na sua conta do dia.
        </p>

        <div class="space-y-2">
            <label class="block text-sm font-bold text-gray-700">Valor (R$)</label>
            <div class="relative">
                <input type="number" id="valor-input" step="0.01" placeholder="0,00" 
                    class="w-full bg-gray-50 border-2 border-gray-200 rounded-2xl p-4 outline-none focus:border-purple-300 transition-all text-gray-700 font-medium">
            </div>
        </div>

        <div class="flex gap-4 mt-8">
            <button onclick="toggleModal()" class="flex-1 py-4 border-2 border-purple-100 text-purple-600 rounded-2xl font-bold hover:bg-purple-50 transition-all">
                Cancelar
            </button>
            <button onclick="salvarValor()" class="flex-1 py-4 bg-[#d8b4fe] text-[#581c87] rounded-2xl font-bold hover:bg-[#c084fc] transition-all">
                Atualizar
            </button>
        </div>
    </div>
</div>
